[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medcp"
version = "0.9.0"
description = "An MCP server that integrates electronic health record databases and a large-scale heterogeneous knowledge graph for rapid clinical record query and fast biomedical knowledge inference"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Wanjun Gu", email = "wanjun.gu@ucsf.edu"},
    {name = "Gianmarco Bellucci", email = "gianmarco.bellucci@ucsf.edu"}
]
maintainers = [
    {name = "Wanjun Gu", email = "wanjun.gu@ucsf.edu"},
    {name = "Gianmarco Bellucci", email = "gianmarco.bellucci@ucsf.edu"}
]
keywords = [
    "mcp",
    "medical",
    "clinical",
    "biomedical",
    "knowledge-graph",
    "electronic-health-records",
    "ehr",
    "neo4j",
    "sql-server",
    "healthcare",
    "bioinformatics",
    "clinical-informatics"
]
dependencies = [
    "mcp==2.0.0",
    "anyio>=4.9,<5",
    "cryptography>=45,<50",
    "neo4j>=5.28.2",
    "pydantic>=2.12,<3",
    "pymssql>=2.3.7",      # Microsoft SQL Server backend
    "pymysql>=1.1.1",      # MySQL / MariaDB backend (pure Python)
    # SQLite backend uses the Python standard library (sqlite3) — no dependency.
]
requires-python = ">=3.11"

scripts.medcp = "medcp.cli:main"

[tool.uv]
# cryptography >=49 (2026-06-12) dropped x86_64 macOS wheels, forcing a
# from-source Rust build on Intel Macs. Cap it there so Intel users still get a
# prebuilt wheel; arm64/Linux/Windows keep the newest compatible version.
constraint-dependencies = [
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
