[project]
name = "medcp-benchmark"
version = "0.1.0"
description = "MedCP clinical-questions benchmark runners + central EHR/LLM warmup"
requires-python = ">=3.9"
# All scripts here — the run_benchmark_*.py runners AND warmup.py — are
# standard-library only. The runners shell out to `biorouter`; warmup.py warms
# the local LLM via the Ollama HTTP API (urllib). No third-party dependencies,
# so a venv is optional (plain `python3 script.py` works too).
dependencies = []

[tool.uv]
package = false   # this is a scripts folder, not an installable package
